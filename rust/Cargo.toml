[package]
name = "localvol"
version = "0.1.0"
edition = "2021"
description = "Dupire local volatility: implied surface, PDE (CN + Rannacher, PSOR) and Monte Carlo pricers"

[dependencies]
rand = "0.8"
rand_distr = "0.4"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "demo"
path = "src/bin/demo.rs"
